<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'IBM Plex Mono', monospace">
  <rect width="800" height="500" fill="#0E1B2C"/>
  <!-- debris / cluttered environment -->
  <g stroke="#3A4A5C" stroke-width="1" fill="none">
    <circle cx="300" cy="150" r="34"/>
    <circle cx="430" cy="330" r="46"/>
    <circle cx="250" cy="360" r="26"/>
    <circle cx="530" cy="140" r="22"/>
  </g>
  <!-- target station -->
  <g stroke="#9FB3C8" stroke-width="1.5" fill="none">
    <rect x="616" y="216" width="64" height="64"/>
    <line x1="616" y1="248" x2="586" y2="248"/>
    <line x1="680" y1="232" x2="740" y2="232"/>
    <line x1="680" y1="264" x2="740" y2="264"/>
    <rect x="740" y="222" width="10" height="52"/>
  </g>
  <!-- docking port -->
  <circle cx="586" cy="248" r="6" fill="#EA5A0B"/>
  <!-- SCvx trajectory iterations -->
  <g fill="none" stroke-width="2">
    <path d="M 90 420 C 240 430 400 400 560 280" stroke="#3A4A5C" stroke-dasharray="4 6"/>
    <path d="M 90 420 C 220 390 380 340 570 262" stroke="#5C7089" stroke-dasharray="6 6"/>
    <path d="M 90 420 C 210 350 400 290 580 250" stroke="#EA5A0B"/>
  </g>
  <!-- chaser -->
  <g transform="translate(90 420)">
    <rect x="-10" y="-10" width="20" height="20" stroke="#EA5A0B" stroke-width="1.5" fill="none" transform="rotate(20)"/>
  </g>
  <text x="60" y="46" fill="#9FB3C8" font-size="15" letter-spacing="2">SEQUENTIAL CONVEXIFICATION</text>
  <text x="60" y="466" fill="#5C7089" font-size="13">TRAJECTORY OPTIMIZATION</text>
  <text x="700" y="466" fill="#5C7089" font-size="13">SCVX</text>
</svg>
