<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'IBM Plex Mono', monospace">
  <rect width="800" height="500" fill="#0E1B2C"/>
  <!-- coarse voxels (far from task) -->
  <g stroke="#3A4A5C" stroke-width="1" fill="none">
    <rect x="60" y="80" width="96" height="96"/>
    <rect x="60" y="176" width="96" height="96"/>
    <rect x="60" y="272" width="96" height="96"/>
    <rect x="156" y="80" width="96" height="96"/>
    <rect x="156" y="272" width="96" height="96"/>
    <rect x="252" y="80" width="96" height="96"/>
  </g>
  <!-- mid resolution -->
  <g stroke="#5C7089" stroke-width="1" fill="none">
    <rect x="252" y="176" width="48" height="48"/>
    <rect x="300" y="176" width="48" height="48"/>
    <rect x="252" y="224" width="48" height="48"/>
    <rect x="300" y="224" width="48" height="48"/>
    <rect x="252" y="272" width="48" height="48"/>
    <rect x="300" y="272" width="48" height="48"/>
    <rect x="348" y="176" width="48" height="48"/>
    <rect x="348" y="224" width="48" height="48"/>
  </g>
  <!-- fine voxels around the goal -->
  <g stroke="#9FB3C8" stroke-width="1" fill="none">
    <g>
      <rect x="396" y="176" width="24" height="24"/><rect x="420" y="176" width="24" height="24"/><rect x="444" y="176" width="24" height="24"/><rect x="468" y="176" width="24" height="24"/>
      <rect x="396" y="200" width="24" height="24"/><rect x="444" y="200" width="24" height="24"/>
      <rect x="396" y="224" width="24" height="24"/><rect x="420" y="224" width="24" height="24"/><rect x="444" y="224" width="24" height="24"/><rect x="468" y="224" width="24" height="24"/>
      <rect x="420" y="248" width="24" height="24"/><rect x="468" y="248" width="24" height="24"/>
      <rect x="396" y="272" width="24" height="24"/><rect x="444" y="272" width="24" height="24"/><rect x="468" y="272" width="24" height="24"/>
    </g>
  </g>
  <!-- goal voxels -->
  <g fill="#EA5A0B">
    <rect x="492" y="200" width="24" height="24"/>
    <rect x="516" y="224" width="24" height="24"/>
    <rect x="492" y="248" width="24" height="24"/>
    <rect x="540" y="200" width="24" height="24" opacity="0.55"/>
    <rect x="516" y="176" width="24" height="24" opacity="0.35"/>
  </g>
  <!-- agent path -->
  <path d="M 108 420 C 250 400 360 340 470 260" stroke="#EA5A0B" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  <circle cx="108" cy="420" r="5" fill="#9FB3C8"/>
  <text x="60" y="46" fill="#9FB3C8" font-size="15" letter-spacing="2">TASK-AWARE VOXEL RESOLUTION</text>
  <text x="606" y="466" fill="#5C7089" font-size="13">RL · 3D MAPS</text>
</svg>
